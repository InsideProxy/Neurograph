# Web de NeuroGraph del instalador Linux (H10): solo archivos estaticos.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # El arranque reescribe el JS (puerto de la API) sin cambiarle el nombre:
    # con cache, el navegador podria seguir hablando con otra API (B3).
    add_header Cache-Control "no-cache" always;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
}
