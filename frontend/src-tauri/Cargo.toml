[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# Selector nativo de archivos para "Importar síntesis de IA" (decisión
# 71, 11/09/2026) -- deliberadamente NO se añade tauri-plugin-fs junto a
# este: la lectura del archivo elegido la hace un comando propio en Rust
# (src/synthesis.rs), no el plugin genérico de filesystem, para no tener
# que conceder alcance de lectura de disco de antemano a una ruta que
# solo se conoce en el momento en que la propia usuaria la elige con
# este diálogo -- ver el comentario de cabecera de synthesis.rs.
tauri-plugin-dialog = "2"
