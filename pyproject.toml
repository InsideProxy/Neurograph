[project]
name = "neurograph"
version = "0.1.0"
description = "Motor científico, API y capa MCP de NeuroGraph."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "nibabel>=5.2",
    "networkx>=3.3",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]
tractography = ["dipy>=1.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
